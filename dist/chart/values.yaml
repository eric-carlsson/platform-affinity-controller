## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  replicas: 1

  image:
    repository: ghcr.io/eric-carlsson/platform-affinity-controller
    tag: ""
    pullPolicy: IfNotPresent

  ## Additional arguments
  ##
  args:
    - --leader-elect

  ## Environment variables
  ##
  env: []

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  imagePullSecrets: []

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

## Helper RBAC roles for managing custom resources
##
rbacHelpers:
  # Install convenience admin/editor/viewer roles for CRDs
  enable: false

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enable: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint with RBAC protection.
##
metrics:
  enable: true
  # Metrics server port
  port: 8443

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enable: true

## Platform affinity behavior applied to Pods whose images support the
## target platform. Mirrors the manager's --affinity-mode, --affinity-weight,
## --target-arch, and --target-os flags. Both targetArch and targetOS default
## to empty, which leaves the webhook a no-op until you configure at least one.
##
affinity:
  ## One of "preferred" (non-blocking, biases scheduling) or "required"
  ## (blocking, restricts scheduling to matching nodes).
  ##
  mode: preferred

  ## Weight (1-100) used for preferred-mode node affinity terms.
  ##
  weight: 100

  ## Target architecture to prefer or require when every Pod image supports
  ## it (for example, "amd64" or "arm64"). Empty by default; set this (and/or
  ## targetOS) to activate the webhook.
  ##
  targetArch: ""

  ## Target OS to prefer or require when every Pod image supports it (for
  ## example, "linux" or "windows"). Empty by default; set this (and/or
  ## targetArch) to activate the webhook.
  ##
  targetOS: ""

## Webhook server configuration
##
webhook:
  enable: true
  # Webhook server port
  port: 9443

  ## How the API server handles unrecognized errors and timeouts.
  ## One of "Ignore" (fail open, Pods admitted unchanged) or "Fail" (fail closed).
  ##
  failurePolicy: Ignore

  ## Restrict which namespaces the webhook applies to. Uses the standard
  ## Kubernetes LabelSelector shape (matchLabels/matchExpressions). Left empty,
  ## the webhook applies to all namespaces except the one it fails to reach.
  ## Example:
  ## namespaceSelector:
  ##   matchExpressions:
  ##   - key: kubernetes.io/metadata.name
  ##     operator: NotIn
  ##     values:
  ##     - kube-system
  ##
  namespaceSelector: {}

  ## Restrict which Pods the webhook applies to, in addition to the chart's
  ## built-in exclusion of its own manager Pod. Uses the standard Kubernetes
  ## LabelSelector shape (matchLabels/matchExpressions).
  ## Example:
  ## objectSelector:
  ##   matchExpressions:
  ##   - key: platform-affinity-controller.io/skip
  ##     operator: DoesNotExist
  ##
  objectSelector: {}

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enable: false
